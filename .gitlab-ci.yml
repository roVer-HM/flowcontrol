image: python:3.12

stages:
  - unit_test
  - integration_test

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - ./venv

before_script:
  - apt-get update -q && apt-get install -y -q --no-install-recommends default-jre-headless
  - python -m venv ./venv
  - source ./venv/bin/activate
  - pip install -q -I -r requirements.txt

unittests:
  stage: unit_test
  script:
    - source ./venv/bin/activate
    - python -m unittest discover -v
  timeout: 20m

integrationtest:
  stage: integration_test
  script:
    - java -version
    - source ./venv/bin/activate
    - python setup.py install
    - cd tutorials
    - python tutorial__set_targets_with_app.py --port 9999 --host-name localhost --client-mode --start-server --output-dir tutorial__set_targets_with_app --download-jar-file --suppress-prompts
    - python tutorial__set_targets.py --port 9999 --host-name localhost --client-mode --start-server --controller-type PingPong --output-dir tutorial__set_targets --download-jar-file --suppress-prompts
  allow_failure: false