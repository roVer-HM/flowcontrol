stages:
  - unit_test
  - integration_test

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - ./venv
    - ./jre

before_script:
  - PYBIN=$(command -v python3.8 || command -v python3.9 || command -v python3 || command -v python)
  - echo "Using $PYBIN"
  - $PYBIN -m venv --system-site-packages ./venv
  - source ./venv/bin/activate
  - pip3 install -q -I -r requirements.txt

unittests:
  stage: unit_test
  script:
    - source ./venv/bin/activate
    - python3 -m unittest discover -v
  timeout: 20m

integrationtest:
  stage: integration_test
  script:
    - |
      if [ ! -d "jre/bin" ]; then
        echo "Downloading portable JRE..."
        wget -q -O jre.tar.gz "https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jre/hotspot/normal/eclipse"
        mkdir -p jre
        tar -xzf jre.tar.gz -C jre --strip-components=1
        rm jre.tar.gz
      fi
    - export PATH=$PWD/jre/bin:$PATH
    - java -version
    - source ./venv/bin/activate
    - python3 setup.py install
    - cd tutorials
    - python3 tutorial__set_targets_with_app.py --port 9999 --host-name localhost --client-mode --start-server --output-dir tutorial__set_targets_with_app --download-jar-file --suppress-prompts
    - python3 tutorial__set_targets.py --port 9999 --host-name localhost --client-mode --start-server --controller-type PingPong --output-dir tutorial__set_targets --download-jar-file --suppress-prompts
  allow_failure: false